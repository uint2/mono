[package]
name = "git-checkout4"
version = "0.1.0"
edition = "2024"

[dependencies]
log = { version = "0.1.0" , path = "../logger.rs" }
rayon = "1.12.0"
normpath = "1.5.2"

[dev-dependencies]
regex = "1.13.1"
cucumber = { version = "0.20", features = ["tracing"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "process", "io-util", "time"] }
walkdir = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
strip-ansi-escapes = "0.2.1"

[[bin]]
path = "bin/gco.rs"
name = "git-checkout4"
test = false

[lib]
doctest = false
test = false

[[test]]
name = "step_definitions" # this should be the same as the filename of your test target
harness = false  # allows Cucumber to print output instead of libtest
