[package]
name = "ln"
version = "0.1.0"
edition = "2024"

[[bin]]
path = "src/main.rs"
name = "git-ln"

[profile.release]
opt-level = "z"
strip = "symbols"
codegen-units = 1
lto = "fat"

[dependencies]
crossterm = "0.28.1"

[features]
# Enabled for later versions of less that support the `--cmd` flag.
less_cmd = []
